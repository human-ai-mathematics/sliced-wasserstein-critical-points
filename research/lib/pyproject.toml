# The shared computation code of research/runs/, kept apart from the checker's
# pyproject.toml (SPECIFICATION.md, Formats → Run). Tests:
#   uv run --project research/lib python -m unittest discover -s research/lib/tests
[project]
name = "swcrit"
version = "0"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swcrit"]
