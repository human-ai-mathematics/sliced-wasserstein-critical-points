# The claim graph: what is mathematically claimed. Only the orchestrator writes this file,
# and `uv run scripts/check.py` must return 0 errors afterwards. Fields: SPECIFICATION.md,
# Formats → Ledger.
#
# The four statements of the 17 October 2026 scouting (prop:notions-coincide,
# thm:gaussian-target, thm:radial-d3, thm:radial-disc-d2; route ap:certify-scouting) and
# prop:critical-sphere were certified on 20 October 2026 by fresh agent reviews; no human has
# accepted them yet.

nodes:

  # --- normalizations
  - id: def:sliced-wasserstein
    status: defined

  - id: def:barycentric-field
    status: defined
    depends_on: [def:sliced-wasserstein]

  - id: def:critical-point
    status: defined
    depends_on: [def:barycentric-field]

  # --- the target
  - id: conj:sw-critical
    status: open
    depends_on: [def:critical-point]
    bounded_by: [prop:critical-segments, prop:critical-sphere]

  # --- the setting
  - id: prop:notions-coincide
    status: proved
    depends_on: [def:critical-point]
    proofs:
      - artifact: solutions/prop-notions-coincide.md
        review: research/reviews/2026-10-20-prop-notions-coincide-rereview3.md

  # --- singular critical points, from the literature
  - id: prop:critical-segments
    status: proved
    depends_on: [def:critical-point]
    references: [VauthierKorbaMerigot2025]

  # A preprint (6 October 2026), proved here by a direct dossier: "Proved (from a preprint)".
  - id: prop:critical-sphere
    status: proved
    depends_on: [def:critical-point, prop:notions-coincide]
    references: [DiazMartinMurphy2026]
    proofs:
      - artifact: solutions/prop-critical-sphere.md
        review: research/reviews/2026-10-20-prop-critical-sphere-rereview3.md

  # --- special cases
  - id: thm:bonnotte-full-support
    status: proved
    depends_on: [def:critical-point]
    references: [Bonnotte2013, VauthierKorbaMerigot2025]

  # The flow theorem is Cozzi–Santambrogio's; its consequence for critical points is drawn
  # in VKM §7. Both refereed. Superseded by thm:gaussian-target (proved).
  - id: thm:cs-isotropic
    status: proved
    depends_on: [def:critical-point]
    references: [CozziSantambrogio2025, VauthierKorbaMerigot2025]

  - id: thm:gaussian-target
    status: proved
    depends_on: [def:critical-point]
    proofs:
      - artifact: solutions/thm-gaussian-target.md
        review: research/reviews/2026-10-20-thm-gaussian-target.md

  - id: thm:radial-d3
    status: proved
    depends_on: [def:critical-point]
    proofs:
      - artifact: solutions/thm-radial-d3.md
        review: research/reviews/2026-10-20-sharpened-statements-rereview.md

  - id: thm:radial-disc-d2
    status: proved
    depends_on: [def:critical-point]
    proofs:
      - artifact: solutions/thm-radial-disc-d2.md
        review: research/reviews/2026-10-20-sharpened-statements-rereview.md
